{% load static %}
{% comment %}
  地図（Leaflet + OpenStreetMap）を使うページで、extra_head と extra_js の中から読み込む部品。
  mode="css" で CSS、mode="js" で JavaScript を出す。
  Leaflet はバージョンを固定し、integrity（SRI）で中身が改ざんされていないことを確かめてから読み込む。
{% endcomment %}
{% if mode == "css" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
{% else %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{% static 'js/shop_map.js' %}"></script>
{% endif %}
