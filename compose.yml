services:
  web:
    build: .
    container_name: deeplog_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: deeplog_db
    environment:
      POSTGRES_DB: deeplog_db
      POSTGRES_USER: world_company
      POSTGRES_PASSWORD: djan2005go
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data: